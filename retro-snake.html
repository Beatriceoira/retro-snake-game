<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Snake</title>
<style>
:root{--page:#c9c6b8;--shell:#3b3a36;--lcd:#9bbc0f;--ink:#0f380f;--text:#f2efe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d1d1b;--shell:#34332f}}
:root[data-theme="dark"]{--page:#1d1d1b;--shell:#34332f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);font-family:"Courier New",ui-monospace,monospace;color:var(--text)}
.shell{background:var(--shell);padding:16px;border-radius:18px;width:min(92vw,440px)}
.bar{display:flex;justify-content:space-between;font-weight:bold;margin:0 4px 10px;font-size:15px}
.screen{position:relative;background:var(--lcd);border:4px solid var(--ink);line-height:0}
canvas{width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;display:block}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);background:rgba(155,188,15,.88);text-align:center;line-height:1.3;font-weight:bold}
.msg.hide{display:none}
.msg b{font-size:26px}
.hint{margin:10px 4px 0;font-size:12px;opacity:.8;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="bar"><span>SCORE <span id="score">0</span></span><span>BEST <span id="best">0</span></span></div>
  <div class="screen">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="msg" id="msg"><b id="title">SNAKE</b><span id="sub">Press any arrow key or swipe to start</span></div>
  </div>
  <p class="hint">Arrows or WASD to steer · Space to pause · Swipe on touch</p>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = canvas.width / CELL, ROWS = canvas.height / CELL;
const INK = '#0f380f', LCD = '#9bbc0f';
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const msg = document.getElementById('msg'), titleEl = document.getElementById('title'), subEl = document.getElementById('sub');

let snake, dx, dy, queue, food, score, best = 0, state; // state: ready | running | paused | over
try { best = +localStorage.getItem('snakeBest') || 0; } catch (e) {}
bestEl.textContent = best;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dx = 1; dy = 0; queue = []; score = 0;
  scoreEl.textContent = 0;
  placeFood();
  state = 'ready';
  draw();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function steer(ndx, ndy) {
  const last = queue.length ? queue[queue.length - 1] : {dx, dy};
  if (ndx === -last.dx && ndy === -last.dy) return; // no reversing
  if (ndx === last.dx && ndy === last.dy) return;
  if (queue.length < 3) queue.push({dx: ndx, dy: ndy});
  if (state === 'ready') start();
}

function start() { state = 'running'; msg.classList.add('hide'); }

function showMsg(t, s) { titleEl.textContent = t; subEl.textContent = s; msg.classList.remove('hide'); }

function tick() {
  if (state !== 'running') return;
  if (queue.length) { ({dx, dy} = queue.shift()); }
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  // collision: walls and self
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);                       // shift body: add new head...
  if (head.x === food.x && head.y === food.y) {
    score += 10; scoreEl.textContent = score; placeFood();
  } else {
    snake.pop();                             // ...and drop the tail
  }
  draw();
}

function gameOver() {
  state = 'over';
  if (score > best) {
    best = score; bestEl.textContent = best;
    try { localStorage.setItem('snakeBest', best); } catch (e) {}
  }
  draw();
  showMsg('GAME OVER', 'Score ' + score + ' · Press Space or tap to retry');
}

function draw() {
  ctx.fillStyle = LCD;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = INK;
  ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8); // food
  snake.forEach((s, i) => {
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  });
}

function togglePause() {
  if (state === 'running') { state = 'paused'; showMsg('PAUSED', 'Press Space to resume'); }
  else if (state === 'paused') start();
}

document.addEventListener('keydown', e => {
  const k = e.key;
  const map = {ArrowUp:[0,-1], w:[0,-1], W:[0,-1], ArrowDown:[0,1], s:[0,1], S:[0,1],
               ArrowLeft:[-1,0], a:[-1,0], A:[-1,0], ArrowRight:[1,0], d:[1,0], D:[1,0]};
  if (map[k]) { e.preventDefault(); if (state !== 'paused' && state !== 'over') steer(...map[k]); }
  else if (k === ' ') {
    e.preventDefault();
    if (state === 'over') reset(); else togglePause();
  }
});

// touch: swipe to steer, tap to restart/resume
let t0 = null;
canvas.parentElement.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive: true});
canvas.parentElement.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], ax = t.clientX - t0.clientX, ay = t.clientY - t0.clientY;
  t0 = null;
  if (Math.abs(ax) < 20 && Math.abs(ay) < 20) {
    if (state === 'over') reset(); else togglePause();
    return;
  }
  if (state === 'paused' || state === 'over') return;
  if (Math.abs(ax) > Math.abs(ay)) steer(ax > 0 ? 1 : -1, 0); else steer(0, ay > 0 ? 1 : -1);
}, {passive: true});
canvas.parentElement.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

reset();
setInterval(tick, 100); // game loop: one step every 100 ms
</script>
</body>
</html>
